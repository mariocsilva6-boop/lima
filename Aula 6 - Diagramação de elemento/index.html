<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Diagramação de Elementos</title>
    <style>
        .container {
            width: 500px;
            height: 600px;
            border: 5px solid black;
            text-align: center;
        }
        img {
            width: 100px;
            height: 100px;
            background-color: dodgerblue;
        }

        span {
            font-size: 20px;
            vertical-align: top;
        }
        .item1 {
            background-color: rgba(0, 0, 255);
            width: 150px;
            height: 150px;
            display: inline-block;
        }
        .item2 {
            width: 150px;
            height: 150px;
            background-color: rgba(255, 0, 0);
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        <button>Lore ipsum</button>
        <div>
            <img>
            <span> Exemplo vertical-align</span>
        </div>
    <div class="item1">Item 1</div>
    <div class="item2">Item 2</div>
    </div>
</body>
</html>
