<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p><label>Senha:</label>
                <input type="password" name="senha" required maxlength="8">
            </p>
            <p><label>Email:</label>
                <input type="email" name="email" placeholder="Digite seu email" required>
            </p>

            <p><label>CEP:</label>
                <input type="number" id="cep" name="cep" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    title="Use o formato (99) 99999-9999" required>
            </p>
            <p><label>Telefone:</label>
                <input type="tel" name="telefone" placeholder="Digite seu telefone" required>
            </p>
            <p><label>Sobre você:</label>
                <textarea name="bio" rows="10" cols="100" placeholder="Conte um pouco sobre você..."></textarea>
            </p>
            <p><label>Gênero:</label>
                <input type="radio" name="genero" value="M" required> Masculino
                <input type="radio" name="genero" value="F"> Feminino
            </p>
            <p><label>interesses</label></p>
            <input type="checkbox" name="interesses" value="esportes">Esportes
            <input type="checkbox" name="interesses" value="musica">Música
            <input type="checkbox" name="interesses" value="filmes">Filmes
            </p>
            <p><label>País:</label>
                <select name="pais" required>
                    <option value="">---</option>
                    <option value="brasil">Brasil</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                </select>
            </p>
            <p><label>Foto de Perfil:</label>
                <input type="file" name="foto">
            </p>
            <p><label></label></p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section>
</body>

</html>
